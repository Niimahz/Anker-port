# Codemagic CI for Anker Port. GitHub remains the source repository.
workflows:
  anker-preflight:
    name: Anker macOS SDK preflight
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      xcode: latest
    scripts:
      - name: Check macOS Xcode MetalFX and tools
        script: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcode-select -p
          command -v git
          command -v python3
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          grep -R -l -q 'MTLFXFrameInterpolatorDescriptor' "$sdk/System/Library/Frameworks/MetalFX.framework/Headers"
          echo "MetalFX SDK symbol found"
  anker-ipa:
    name: Anker Port Madeira unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        CONFIGURATION: Debug
    scripts:
      - name: Build pinned Madeira with StikJIT and package IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          echo '=== ANKER PHASE 1: SDK ==='
          set -euo pipefail
          echo "Runner: $(sw_vers -productVersion)"
          echo "Active Xcode: $(xcode-select -p)"
          xcodebuild -version
          echo "Checking installed Xcode SDKs for the MetalFX frame interpolation API"
          selected=""
          for developer in /Applications/Xcode*.app/Contents/Developer; do
            [ -d "$developer" ] || continue
            sdk="$developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
            [ -d "$sdk" ] || continue
            if grep -R -l -q 'MTLFXFrameInterpolatorDescriptor' "$sdk/System/Library/Frameworks/MetalFX.framework/Headers" 2>/dev/null; then
              selected="$developer"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "::error::No installed iPhoneOS SDK declares MTLFXFrameInterpolatorDescriptor. The pinned DXMT source requires this API; do not spend hours compiling against an incompatible SDK."
            exit 1
          fi
          echo "Selected compatible Xcode: $selected"
          export DEVELOPER_DIR="$selected"
          DEVELOPER_DIR="$selected" xcrun --sdk iphoneos --show-sdk-version
          # Verify actual Objective-C compilation, not just a matching header string.
          cat > /tmp/anker-metalfx-probe.m <<'EOF'
          #import <MetalFX/MetalFX.h>
          static void anker_metalfx_probe(void) {
              MTLFXFrameInterpolatorDescriptor *descriptor = [MTLFXFrameInterpolatorDescriptor new];
              (void)descriptor;
          }
          EOF
          DEVELOPER_DIR="$selected" xcrun --sdk iphoneos clang -x objective-c -fsyntax-only -Werror=implicit-function-declaration -target arm64-apple-ios17.0 -isysroot "$(DEVELOPER_DIR="$selected" xcrun --sdk iphoneos --show-sdk-path)" /tmp/anker-metalfx-probe.m
          echo "MetalFX frame interpolation compile probe passed"
          echo '=== ANKER PHASE 2: Madeira checkout ==='
          git clone --filter=blob:none https://github.com/willfaust/Madeira.git native-src
          git -C native-src checkout fbad430410b4075192166172447c859714726de9
          echo '=== ANKER PHASE 3: StikJIT ==='
          set -euo pipefail
          echo "Rebuilding StikJIT from tagged source instead of modifying Swift interfaces generated by a newer compiler"
          git clone --depth 1 --branch 2.0.1 https://github.com/StikDebug/StikJIT.git /tmp/anker-stikjit-src
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd /tmp/anker-stikjit-src
          xcodegen generate
          xcodebuild archive -scheme StikJIT -configuration Release -destination 'generic/platform=iOS' -archivePath /tmp/anker-stikjit-archive CODE_SIGNING_ALLOWED=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          xcodebuild -create-xcframework -framework /tmp/anker-stikjit-archive.xcarchive/Products/Library/Frameworks/StikJIT.framework -output /tmp/anker-StikJIT.xcframework
          cd "$CM_BUILD_DIR"
          rm -rf native-src/app/Frameworks/StikJIT.xcframework
          cp -R /tmp/anker-StikJIT.xcframework native-src/app/Frameworks/StikJIT.xcframework
          python3 - <<'PY'
          from pathlib import Path
          root = Path("native-src/app/Frameworks/StikJIT.xcframework")
          interfaces = list(root.rglob("*.swiftinterface"))
          assert interfaces, "No StikJIT Swift module interfaces were produced"
          for path in interfaces:
              source = path.read_text()
              assert "::" not in source, f"Malformed interface: {path}"
              print(path, source.splitlines()[1])
          PY
          echo '=== ANKER PHASE 4: Anker integration ==='
          python3 runtime/tools/brand-upstream.py native-src
          python3 runtime/tools/integrate-upstream.py native-src
          xcrun swiftc -frontend -parse native-src/app/Madeira/MadeiraApp.swift
          echo '=== ANKER PHASE 5: DXMT patch ==='
          git -C native-src submodule update --init dxmt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("native-src/dxmt/src/airconv/shaders/air_tessellation.metal")
          original = p.read_text()
          old = "__metal_atomic_fetch_add_explicit(out_count, 1, int(memory_order_relaxed), __METAL_MEMORY_SCOPE_THREADGROUP__, __METAL_MEMORY_FLAGS_NONE__)"
          new = "__metal_atomic_fetch_add_explicit(out_count, 1, int(memory_order_relaxed), __METAL_MEMORY_SCOPE_THREADGROUP__)"
          if old in original:
              assert original.count(old) == 1, "Unexpected duplicate atomic calls"
              p.write_text(original.replace(old, new))
              print("Patched DXMT 5-argument atomic call to 4-argument Metal API")
          elif new in original:
              print("DXMT already uses 4-argument atomic call")
          else:
              raise SystemExit("DXMT atomic call changed upstream: refusing unsafe patch")
          updated = p.read_text()
          assert old not in updated and new in updated, "DXMT patch verification failed"
          PY
          python3 - <<'PY'
          from pathlib import Path
          script = Path("native-src/tools/build/build-shader-headers.sh")
          source = script.read_text()
          begin = source.index("# Metal toolchain 32023")
          end = source.index('for name in "${SHADERS[@]}"; do', begin)
          replacement = """# Anker compatibility: macos-15 Metal compiler expects exactly four atomic arguments.
          # Do not rewrite the pinned DXMT shader back to the five-argument Xcode 27 form.
          test -f "$SRC/air_tessellation.metal"
          grep -Fq '__metal_atomic_fetch_add_explicit(out_count, 1, int(memory_order_relaxed), __METAL_MEMORY_SCOPE_THREADGROUP__);' "$SRC/air_tessellation.metal"
          if grep -Fq '__METAL_MEMORY_FLAGS_NONE__);' "$SRC/air_tessellation.metal"; then
            echo "ERROR: DXMT shader has incompatible five-argument atomic call" >&2
            exit 1
          fi
          
          """
          script.write_text(source[:begin] + replacement + source[end:])
          assert "Pass it when the toolchain defines it" not in script.read_text()
          print("Disabled upstream Xcode 27 shader rewrite for macos-15")
          PY
          echo '=== ANKER PHASE 6: FEX init ==='
          git -C native-src submodule update --init --depth 1 FEX
          test -f native-src/FEX/CMakeLists.txt
          echo '=== ANKER PHASE 7: Native build ==='
          cd native-src
          bash tools/build-ipa.sh
          cd "$CM_BUILD_DIR"
          echo '=== ANKER PHASE 8: IPA packaging ==='
          mkdir -p dist
          cp native-src/dist/Madeira.ipa dist/AnkerPort-unsigned.ipa
          python3 runtime/tools/verify-ipa.py dist/AnkerPort-unsigned.ipa
          shasum -a 256 dist/AnkerPort-unsigned.ipa > dist/SHA256SUMS
    artifacts:
      - dist/*.ipa
      - dist/SHA256SUMS
      - native-src/build/**/*.err
      - native-src/build/**/*.log
