name: Compile real on-device Windows runtime
on:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: 'macOS runner for IPA build (switch if one runner pool is unavailable)'
        type: choice
        required: true
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-native-runtime.yml'
concurrency:
  group: anker-native-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate integration tools before reserving macOS
        run: |
          python3 -m py_compile runtime/tools/brand-upstream.py runtime/tools/integrate-upstream.py runtime/tools/verify-ipa.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash -n runtime/tools/prepare-native.sh runtime/tools/verify-native.sh
      - name: Confirm pinned Madeira source is reachable
        run: |
          git ls-remote https://github.com/willfaust/Madeira.git HEAD
          git ls-remote https://github.com/willfaust/Madeira.git | grep -q 'fbad430410b4075192166172447c859714726de9' || echo 'Pinned SHA is not advertised as a branch tip; checkout will verify it.'
  prepare-integrated-source:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream application source
        run: |
          git clone --filter=blob:none https://github.com/willfaust/Madeira.git native-src
          git -C native-src checkout fbad430410b4075192166172447c859714726de9
      - name: Apply Anker integration and validate generated Swift
        run: |
          python3 runtime/tools/brand-upstream.py native-src
          python3 runtime/tools/integrate-upstream.py native-src
          swiftc -frontend -parse native-src/app/Madeira/MadeiraApp.swift
          grep -q 'ANKER_PORT_INTEGRATION_V1' native-src/app/Madeira/MadeiraApp.swift
          /usr/bin/python3 - <<'PY'
          import plistlib
          with open('native-src/app/Madeira/Info.plist', 'rb') as f:
              assert plistlib.load(f)['CFBundleDisplayName'] == 'Anker Port'
          PY
      - name: Upload integrated app source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: AnkerPort-Integrated-App-Source
          path: |
            native-src/app/Madeira/MadeiraApp.swift
            native-src/app/Madeira/Info.plist
          retention-days: 14
  native-runtime:
    needs: preflight
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Checkout GPL runtime source with native components
        run: |
          git clone https://github.com/willfaust/Madeira.git native-src
          git -C native-src checkout fbad430410b4075192166172447c859714726de9
          git -C native-src submodule update --init --recursive
          git -C native-src rev-parse HEAD > native-source-revision.txt
          cat native-source-revision.txt
      - name: Apply Anker Port product overlay before compilation
        run: |
          python3 runtime/tools/brand-upstream.py native-src
          python3 runtime/tools/integrate-upstream.py native-src
          grep -q 'ANKER_PORT_INTEGRATION_V1' native-src/app/Madeira/MadeiraApp.swift
          /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' native-src/app/Madeira/Info.plist | grep -Fx 'Anker Port'
      - name: Build real Wine FEX DXMT runtime and iOS app
        working-directory: native-src
        env:
          JOBS: 4
        run: |
          ./tools/build-ipa.sh
      - name: Verify native IPA contains actual runtime
        run: |
          test -s native-src/dist/Madeira.ipa
          unzip -tq native-src/dist/Madeira.ipa
          unzip -l native-src/dist/Madeira.ipa | grep 'xtajit64.dll'
          unzip -l native-src/dist/Madeira.ipa | grep 'prefix-template.tar.gz'
      - name: Rename and validate Anker Port fork-derived IPA
        run: |
          cp native-src/dist/Madeira.ipa native-src/dist/AnkerPort-Native.ipa
          unzip -tq native-src/dist/AnkerPort-Native.ipa
          unzip -p native-src/dist/AnkerPort-Native.ipa Payload/Madeira.app/Info.plist > /tmp/anker-info.plist
          /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' /tmp/anker-info.plist | grep -Fx 'Anker Port'
          python3 runtime/tools/verify-ipa.py native-src/dist/AnkerPort-Native.ipa --revision "$(cat native-source-revision.txt)"
      - name: Preserve fork-derived Anker Port native IPA
        uses: actions/upload-artifact@v4
        with:
          name: AnkerPort-Native-IPA
          path: |
            native-src/dist/AnkerPort-Native.ipa
            native-src/dist/AnkerPort-Native.manifest.json
            native-source-revision.txt
          retention-days: 7
      - name: Stage reusable native libraries and guest runtime
        run: |
          bash runtime/tools/prepare-native.sh native-src runtime/staged
          bash runtime/tools/verify-native.sh runtime/staged
      - name: Upload native runtime development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anker-native-runtime-staged
          path: runtime/staged/
          retention-days: 7
