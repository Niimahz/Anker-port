name: Prepare Anker native source on Linux
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-native-runtime.yml'
      - 'runtime/tools/**'
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate integration tools before reserving macOS
        run: |
          python3 -m py_compile runtime/tools/brand-upstream.py runtime/tools/integrate-upstream.py runtime/tools/verify-ipa.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash -n runtime/tools/prepare-native.sh runtime/tools/verify-native.sh
      - name: Confirm pinned Madeira source is reachable
        run: |
          git ls-remote https://github.com/willfaust/Madeira.git HEAD
          git ls-remote https://github.com/willfaust/Madeira.git | grep -q 'fbad430410b4075192166172447c859714726de9' || echo 'Pinned SHA is not advertised as a branch tip; checkout will verify it.'
  prepare-integrated-source:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream application source
        run: |
          git clone --filter=blob:none https://github.com/willfaust/Madeira.git native-src
          git -C native-src checkout fbad430410b4075192166172447c859714726de9
      - name: Apply Anker integration and validate generated Swift
        run: |
          python3 runtime/tools/brand-upstream.py native-src
          python3 runtime/tools/integrate-upstream.py native-src
          swiftc -frontend -parse native-src/app/Madeira/MadeiraApp.swift
          grep -q 'ANKER_PORT_INTEGRATION_V1' native-src/app/Madeira/MadeiraApp.swift
          /usr/bin/python3 - <<'PY'
          import plistlib
          with open('native-src/app/Madeira/Info.plist', 'rb') as f:
              assert plistlib.load(f)['CFBundleDisplayName'] == 'Anker Port'
          PY
      - name: Upload integrated app source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: AnkerPort-Integrated-App-Source
          path: |
            native-src/app/Madeira/MadeiraApp.swift
            native-src/app/Madeira/Info.plist
          retention-days: 14
  linux-native-package:
    needs: prepare-integrated-source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare actual upstream source tree
        run: |
          git clone --filter=blob:none https://github.com/willfaust/Madeira.git native-src
          git -C native-src checkout fbad430410b4075192166172447c859714726de9
          python3 runtime/tools/brand-upstream.py native-src
          python3 runtime/tools/integrate-upstream.py native-src
          swiftc -frontend -parse native-src/app/Madeira/MadeiraApp.swift
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root = Path("native-src/app/Madeira")
          assert "ANKER_PORT_INTEGRATION_V1" in (root / "MadeiraApp.swift").read_text()
          with (root / "Info.plist").open("rb") as handle:
              assert plistlib.load(handle)["CFBundleDisplayName"] == "Anker Port"
          PY
      - name: Package Linux-prepared native source (not an IPA)
        run: |
          tar -czf AnkerPort-Native-Source.tar.gz -C native-src app/Madeira/MadeiraApp.swift app/Madeira/Info.plist
          sha256sum AnkerPort-Native-Source.tar.gz > AnkerPort-Native-Source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AnkerPort-Linux-Native-Source
          path: |
            AnkerPort-Native-Source.tar.gz
            AnkerPort-Native-Source.sha256
          retention-days: 14
