name: Fast source syntax checks
on:
  push:
    branches: [main]
    paths:
      - 'App/Sources/**'
      - 'runtime/**'
      - '.github/workflows/source-lint.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python overlay
        run: python3 -m py_compile runtime/tools/brand-upstream.py runtime/tools/integrate-upstream.py runtime/tools/verify-ipa.py
      - name: Test fork branding overlay and preserved runtime identifiers
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate shell syntax
        run: |
          bash -n runtime/tools/prepare-native.sh
          bash -n runtime/tools/verify-native.sh
      - name: Run executable game settings tests
        run: |
          swiftc App/Sources/GameTuning.swift tests/GameTuningSmoke.swift -o /tmp/anker-tuning-test
          /tmp/anker-tuning-test
      - name: Parse Swift source (no iOS SDK required)
        run: |
          find App/Sources -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse
