name: Validate Anker Port Studio source on Linux
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - '.github/workflows/build-ipa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse Swift app sources on Linux
        run: find App/Sources -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse
      - name: Verify app project specification
        run: |
          test -s App/project.yml
          test -d App/Sources
      - name: Report artifact type
        run: echo 'Linux source validation only. No IPA is produced by this workflow.'
