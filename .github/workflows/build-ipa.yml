name: Build Anker Port unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - '.github/workflows/build-ipa.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate
      - name: Parse Swift source
        working-directory: App
        run: xcrun swiftc -frontend -parse Sources/*.swift
      - name: Build for iPhone without signing
        working-directory: App
        run: xcodebuild -project AnkerPortStudio.xcodeproj -scheme AnkerPortStudio -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        working-directory: App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AnkerPortStudio.app Payload/
          test -f Payload/AnkerPortStudio.app/AnkerPortStudio
          zip -qry AnkerPortStudio-unsigned.ipa Payload
          unzip -t AnkerPortStudio-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AnkerPortStudio-unsigned-IPA
          path: App/AnkerPortStudio-unsigned.ipa
