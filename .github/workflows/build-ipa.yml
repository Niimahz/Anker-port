name: Build Anker Port IPA on macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runtime/tools/integrate-upstream.py'
      - 'runtime/tools/brand-upstream.py'
      - '.github/workflows/build-ipa.yml'
permissions:
  contents: read
concurrency:
  group: anker-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CONFIGURATION: Debug
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Madeira source
        run: |
          git clone --filter=blob:none https://github.com/willfaust/Madeira.git native-src
          git -C native-src checkout fbad430410b4075192166172447c859714726de9
      - name: Integrate Anker with actual Madeira application
        run: |
          python3 runtime/tools/brand-upstream.py native-src
          python3 runtime/tools/integrate-upstream.py native-src
          xcrun swiftc -frontend -parse native-src/app/Madeira/MadeiraApp.swift
      - name: Patch pinned DXMT Metal atomic API compatibility
        run: |
          git -C native-src submodule update --init dxmt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("native-src/dxmt/src/airconv/shaders/air_tessellation.metal")
          original = p.read_text()
          old = "__metal_atomic_fetch_add_explicit(out_count, 1, int(memory_order_relaxed), __METAL_MEMORY_SCOPE_THREADGROUP__, __METAL_MEMORY_FLAGS_NONE__)"
          new = "__metal_atomic_fetch_add_explicit(out_count, 1, int(memory_order_relaxed), __METAL_MEMORY_SCOPE_THREADGROUP__)"
          if old in original:
              assert original.count(old) == 1, "Unexpected duplicate atomic calls"
              p.write_text(original.replace(old, new))
              print("Patched DXMT 5-argument atomic call to 4-argument Metal API")
          elif new in original:
              print("DXMT already uses 4-argument atomic call")
          else:
              raise SystemExit("DXMT atomic call changed upstream: refusing unsafe patch")
          updated = p.read_text()
          assert old not in updated and new in updated, "DXMT patch verification failed"
          PY
      - name: Restore compiled LLVM iOS libraries
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          key: anker-llvm-v1-macos15-fbad4304-${{ hashFiles('native-src/tools/build/build-llvm-ios.sh') }}
          path: |
            native-src/toolchains/llvm-ios-build/.madeira-cache.sha256
            native-src/toolchains/llvm-ios-build/lib
            native-src/toolchains/llvm-ios-build/include
            native-src/toolchains/llvm-project/llvm/include
      - name: Restore compiled FEX iOS libraries
        id: fex-cache
        uses: actions/cache/restore@v4
        with:
          key: anker-fex-v1-macos15-fbad4304-${{ hashFiles('native-src/tools/build/build-fex-ios.sh') }}
          path: native-src/FEX/build-ios
      - name: Restore compiled DXMT iOS library
        id: dxmt-cache
        uses: actions/cache/restore@v4
        with:
          key: anker-dxmt-v2-macos15-fbad4304-atomic4-${{ hashFiles('native-src/tools/build/build-dxmt-ios.sh', 'native-src/tools/build/build-shader-headers.sh') }}
          path: native-src/app/Madeira/libdxmt_combined.a
      - name: Build using upstream Madeira toolchain
        run: |
          cd native-src
          bash tools/build-ipa.sh
      - name: Check reusable libraries produced by the build
        if: always()
        id: cache-check
        run: |
          if [ -s native-src/toolchains/llvm-ios-build/.madeira-cache.sha256 ] &&
             [ -s native-src/toolchains/llvm-ios-build/lib/libLLVMCore.a ] &&
             [ -s native-src/toolchains/llvm-ios-build/lib/libLLVMSupport.a ] &&
             [ -f native-src/toolchains/llvm-project/llvm/include/llvm/IR/Module.h ] &&
             (cd native-src/toolchains/llvm-ios-build && shasum -a 256 -c .madeira-cache.sha256 >/dev/null); then
            echo "llvm=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -s native-src/FEX/build-ios/FEXCore/Source/libFEXCore.a ] &&
             [ -s native-src/FEX/build-ios/FEXCore/Source/libFEXCore_Base.a ] &&
             [ -s native-src/FEX/build-ios/External/fmt/libfmt.a ] &&
             [ -s native-src/FEX/build-ios/External/cephes/libcephes_128bit.a ] &&
             [ -s native-src/FEX/build-ios/FEXCore/Source/libJemallocLibs.a ] &&
             [ -s native-src/FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a ] &&
             [ -s native-src/FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a ]; then
            echo "fex=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -s native-src/app/Madeira/libdxmt_combined.a ]; then
            echo "dxmt=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache completed LLVM libraries even if another component fails
        if: always() && steps.cache-check.outputs.llvm == 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: anker-llvm-v1-macos15-fbad4304-${{ hashFiles('native-src/tools/build/build-llvm-ios.sh') }}
          path: |
            native-src/toolchains/llvm-ios-build/.madeira-cache.sha256
            native-src/toolchains/llvm-ios-build/lib
            native-src/toolchains/llvm-ios-build/include
            native-src/toolchains/llvm-project/llvm/include
      - name: Cache completed FEX libraries even if another component fails
        if: always() && steps.cache-check.outputs.fex == 'true' && steps.fex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: anker-fex-v1-macos15-fbad4304-${{ hashFiles('native-src/tools/build/build-fex-ios.sh') }}
          path: native-src/FEX/build-ios
      - name: Cache completed DXMT library
        if: always() && steps.cache-check.outputs.dxmt == 'true' && steps.dxmt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: anker-dxmt-v2-macos15-fbad4304-atomic4-${{ hashFiles('native-src/tools/build/build-dxmt-ios.sh', 'native-src/tools/build/build-shader-headers.sh') }}
          path: native-src/app/Madeira/libdxmt_combined.a
      - name: Verify and package user-signable IPA
        run: |
          mkdir -p dist
          cp native-src/dist/Madeira.ipa dist/AnkerPort-unsigned.ipa
          python3 runtime/tools/verify-ipa.py dist/AnkerPort-unsigned.ipa
          shasum -a 256 dist/AnkerPort-unsigned.ipa > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: AnkerPort-Unsigned-IPA
          path: dist/
          retention-days: 14
