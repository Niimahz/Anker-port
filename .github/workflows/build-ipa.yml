name: Verify original Madeira IPA baseline (no rebuild)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-upstream-ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download original published Madeira IPA and checksum
        run: |
          mkdir -p dist
          curl -fL --retry 3 -o dist/Madeira-0.2.0.ipa https://github.com/willfaust/Madeira/releases/download/v0.2.0/Madeira-0.2.0.ipa
          curl -fL --retry 3 -o dist/Madeira-0.2.0.ipa.sha256 https://github.com/willfaust/Madeira/releases/download/v0.2.0/Madeira-0.2.0.ipa.sha256
      - name: Verify original file integrity and native runtime resources
        run: |
          cd dist
          sha256sum -c Madeira-0.2.0.ipa.sha256
          unzip -tq Madeira-0.2.0.ipa
          unzip -l Madeira-0.2.0.ipa | grep -q 'Payload/.*\.app/'
          echo 'Verified original Madeira binary; this is NOT an Anker-integrated IPA.'
      - name: Upload unchanged upstream IPA for comparison
        uses: actions/upload-artifact@v4
        with:
          name: Original-Madeira-v0.2.0-IPA
          path: |
            dist/Madeira-0.2.0.ipa
            dist/Madeira-0.2.0.ipa.sha256
          retention-days: 14
